# pyproject.toml

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = [ "src" ]
include = [ "btu_scheduler*" ]

[project]
name = "btu-scheduler"
version = "1.0.0"
description = "A BTU scheduler tool written in Python."
readme = "README.md"
authors = [
	{ name = "Brian Pond", email = "brian@datahenge.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "click ~= 8.1.7",
	"croniter>=6.1.0",
	"databases[asyncpg,asyncmy]>=0.9.0",  # Multi-database support: asyncpg for PostgreSQL, asyncmy for MariaDB/MySQL
	"redis==5.2.1",
	"requests==2.32.5",
 	"rq==1.15.1",  # Keeping this pinned to Frappe Framework v15 version of rq
	"pydantic-settings>=2.0.0",
	"platformdirs>=4.0.0",
	"python-dotenv>=1.0.0",
 	"slack_sdk~=3.31.0",
	"structlog>=24.0.0",
    "temporal_lib>=0.1.2",
]

[project.optional-dependencies]
development = ["twine", "pytest", "ruff>=0.14.0", "ventwig"]

[project.scripts]
btu-scheduler = "btu_scheduler.cli:entry_point"
btu = "btu_scheduler.cli:entry_point"

[tool.ruff]
line-length = 120  # Default is 88

[tool.ruff.format]
indent-style = "tab"

[[tool.ventwig.sources]]
name          = "brian_appkit"
local_path    = "src/btu_scheduler/_vendor/config_logging"
upstream      = "https://github.com/brian-pond/brian_appkit_config_py.git"
upstream_path = "src/brian_appkit"    # optional — defaults to repo root
ref           = "main"          # branch name or tag
